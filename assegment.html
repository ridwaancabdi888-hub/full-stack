<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Form</title>
</head>

<body>
    <main>
        <h1>Student Registration Practice</h1>

        <table border="1">
            <caption>Student ages</caption>
            <thead>
                <tr>
                    <th scope="col">No.</th>
                    <th scope="col">Name</th>
                    <th scope="col">Age</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>RIDWAN</td>
                    <td>30</td>
                </tr>
                <tr>
                    <th scope="row">2</th>
                    <td>maxmed</td>
                    <td>13</td>
                </tr>
                <tr>
                    <th scope="row">3</th>
                    <td>cabdi</td>
                    <td>23</td>
                </tr>
            </tbody>
        </table>

        <h2>Registration form</h2>

        <form>
            <fieldset>
                <legend>Student details</legend>

                <label for="first-name">First name</label><br>
                <input id="first-name" name="firstName" type="text" autocomplete="given-name" required>
                <br><br>

                <label for="last-name">Last name</label><br>
                <input id="last-name" name="lastName" type="text" autocomplete="family-name" required>
                <br><br>

                <label for="email">Email</label><br>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <br><br>

                <label for="password">Password</label><br>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                <br><br>

                <label for="department">Department</label><br>
                <select id="department" name="department" required>
                    <option value="">Choose a department</option>
                    <option value="software-engineering">Software Engineering</option>
                    <option value="networking">Networking</option>
                    <option value="database">Database</option>
                    <option value="cyber-security">Cyber Security</option>
                </select>

                <br><br>

                <button type="submit">Register</button>
            </fieldset>
        </form>
    </main>
</body>
</html>
